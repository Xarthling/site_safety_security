<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Safety operations{% endblock %} · Site safety</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #647383;
      --line: #e4e9ee;
      --surface: #fff;
      --canvas: #f5f7fa;
      --navy: #102b46;
      --blue: #1769aa;
      --blue-soft: #eaf3fb;
      --green: #147a4b;
      --green-soft: #eaf7f0;
      --amber: #a45b08;
      --amber-soft: #fff4e5;
      --red: #b42318;
      --red-soft: #fff0ef;
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .topbar { background: var(--navy); color: #fff; }
    .topbar-inner { max-width: 1440px; margin: auto; padding: 0 2rem; min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; }
    .brand { display: flex; align-items: center; gap: .75rem; color: #fff; font-weight: 700; letter-spacing: -.01em; }
    .brand:hover { text-decoration: none; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; background: #2e8ccf; font-size: 1.05rem; }
    .nav { display: flex; align-items: center; gap: .3rem; }
    .nav a { color: #c9d8e6; padding: .5rem .75rem; border-radius: 7px; font-size: .92rem; }
    .nav a:hover, .nav a.active { color: #fff; background: #ffffff1a; text-decoration: none; }
    .page { max-width: 1440px; margin: auto; padding: 2rem; }
    .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
    .eyebrow { margin: 0 0 .35rem; color: var(--blue); font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1, h2, h3 { margin: 0; letter-spacing: -.025em; }
    h1 { font-size: clamp(1.7rem, 3vw, 2.25rem); }
    h2 { font-size: 1.12rem; }
    .subtitle { margin: .4rem 0 0; color: var(--muted); }
    .surface { background: var(--surface); border: 1px solid var(--line);  box-shadow: 0 4px 18px #17212b08; }
    .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .85rem; margin-bottom: 1.25rem; }
    .stat { padding: 1.1rem 1.2rem; }
    .stat-label { color: var(--muted); font-size: .83rem; font-weight: 600; }
    .stat-value { display: block; margin-top: .2rem; font-size: 1.85rem; font-weight: 750; letter-spacing: -.04em; }
    .stat-accent { border-top: 3px solid var(--blue); }
    .stat-warning { border-top: 3px solid #e29b2d; }
    .stat-success { border-top: 3px solid #39a66f; }
    .toolbar { padding: 1rem 1.15rem; margin-bottom: 1.25rem; }
    .toolbar-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: .85rem; }
    .filter-grid { display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr)) auto auto; gap: .65rem; }
    input, select, textarea { width: 100%; border: 1px solid #cbd5df; border-radius: 8px; background: #fff; color: var(--ink); font: inherit; padding: .58rem .7rem; }
    input:focus, select:focus, textarea:focus { outline: 3px solid #1769aa26; border-color: var(--blue); }
    button, .button { border: 1px solid #cbd5df; border-radius: 8px; background: #fff; color: var(--ink); cursor: pointer; font: inherit; font-weight: 650; padding: .58rem .8rem; text-decoration: none; white-space: nowrap; }
    button:hover, .button:hover { border-color: var(--blue); color: var(--blue); text-decoration: none; }
    .button-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .button-primary:hover { background: #12588f; color: #fff; }
    .button-small { padding: .38rem .55rem; font-size: .82rem; }
    .section { overflow: hidden; margin-bottom: 1.25rem; }
    .section-head { padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .section-note { color: var(--muted); font-size: .86rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .85rem 1.25rem; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); background: #fbfcfd; font-size: .73rem; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fbfdff; }
    .evidence { width: 112px; height: 70px; border-radius: 8px; display: grid; place-items: center; overflow: hidden; background: #edf1f4; color: var(--muted); font-size: .78rem; }
    .evidence img { width: 100%; height: 100%; object-fit: cover; }
    .evidence-link { display: block; width: 100%; height: 100%; }
    .evidence-link:focus-visible { outline: 3px solid var(--blue); outline-offset: -3px; }
    .evidence img.evidence-preview { position: fixed; z-index: 20; top: 50%; left: 50%; width: min(78vw, 760px); height: auto; max-height: 82vh; padding: .45rem; border: 1px solid #fff; border-radius: 12px; background: #102b46eF; box-shadow: 0 18px 55px #102b4666; object-fit: contain; opacity: 0; visibility: hidden; pointer-events: none; transform: translate(-50%, -48%) scale(.97); transition: opacity .16s ease, transform .16s ease, visibility .16s ease; }
    .evidence-link:hover .evidence-preview, .evidence-link:focus-visible .evidence-preview { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
    .preview-hint { display: block; margin-top: .35rem; color: var(--muted); font-size: .74rem; }
    .event-title { font-weight: 700; }
    .detail { max-width: 260px; color: var(--muted); font-size: .88rem; }
    .meta { color: var(--muted); font-size: .82rem; }
    .badge { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .25rem .55rem; font-size: .74rem; font-weight: 700; white-space: nowrap; }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge-unreviewed { color: var(--amber); background: var(--amber-soft); }
    .badge-confirmed, .badge-enabled { color: var(--green); background: var(--green-soft); }
    .badge-false_positive, .badge-disabled { color: var(--red); background: var(--red-soft); }
    .review { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .5rem; }
    .empty { padding: 2.5rem 1rem; color: var(--muted); text-align: center; }
    .actions { display: flex; flex-wrap: wrap; gap: .35rem; }
    .actions form { display: inline; }
    .flash-link { font-size: .86rem; font-weight: 650; }
    @media (max-width: 950px) {
      .stats { grid-template-columns: repeat(3, 1fr); }
      .filter-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 620px) {
      .topbar-inner, .page { padding-left: 1rem; padding-right: 1rem; }
      .topbar-inner { min-height: 60px; align-items: flex-start; padding-top: .8rem; padding-bottom: .8rem; flex-direction: column; gap: .5rem; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .page-heading, .toolbar-head { align-items: flex-start; flex-direction: column; }
      .filter-grid { grid-template-columns: 1fr; }
      th, td { padding: .7rem .8rem; }
      .evidence-preview { width: 92vw; max-height: 70vh; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{% url 'dashboard' %}"><span>Site safety operations</span></a>
      <nav class="nav" aria-label="Primary navigation">
        <a class="{% block dashboard_nav %}{% endblock %}" href="{% url 'dashboard' %}">Event review</a>
        <a class="{% block cameras_nav %}{% endblock %}" href="{% url 'cameras' %}">Cameras</a>
      </nav>
    </div>
  </header>
  <main class="page">{% block content %}{% endblock %}</main>
</body>
</html>
