<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add camera</title>
<style>body{margin:2rem;background:#f3f5f7;color:#17202a;font:15px system-ui,sans-serif}main{max-width:700px;margin:auto}section{background:#fff;padding:1rem;border-radius:8px}label{display:block;margin:.8rem 0;font-weight:600}input,select{display:block;box-sizing:border-box;width:100%;padding:.45rem;margin-top:.3rem;font:inherit}button{padding:.5rem 1rem}.error{color:#8d1d00;background:#fee;padding:.7rem}.hint{color:#607080;font-weight:normal}</style></head>
<body><main><p><a href="{% url 'cameras' %}">Back to cameras</a></p><h1>Add camera</h1><section>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}
<label>Camera ID <span class="hint">letters, numbers, _ and - only</span><input name="camera_id" value="{{ values.camera_id }}" required></label>
<label>Name<input name="name" value="{{ values.name }}" required></label>
<label>Source type<select name="source_type"><option value="recorded">Recorded file</option><option value="rtsp">RTSP</option></select></label>
<label>Source path or URI<input name="source_path" value="{{ values.source_path }}" required></label>
<label>Capabilities <span class="hint">comma-separated: ppe, vehicles, licence_plates</span><input name="capabilities" value="{{ values.capabilities }}"></label>
<button type="submit">Add camera</button></form>
</section></main></body></html>
