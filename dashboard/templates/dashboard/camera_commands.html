<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Camera replay</title>
<style>body{margin:2rem;background:#f3f5f7;color:#17202a;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto}section{background:#fff;padding:1rem;border-radius:8px}video{display:block;max-width:100%;background:#000}pre{white-space:pre-wrap;background:#f3f5f7;padding:.7rem}</style></head>
<body><main><p><a href="{% url 'cameras' %}">Back to cameras</a> · <a href="{% url 'camera-edit' camera.id %}">Edit camera</a> · <a href="{% url 'camera-live' camera.id %}">Run dashboard inference</a></p><h1>{{ camera.name }} — live/replay</h1><section>
{% if source_ready %}<video controls autoplay muted src="{% url 'camera-video' camera.id %}">Your browser cannot play this video.</video>{% else %}<p>Source is not ready. <a href="{% url 'camera-test' camera.id %}">Test the source</a>.</p>{% endif %}
<h2>Run annotated replay</h2><pre>{{ run_command }}</pre><h2>Open live preview</h2><pre>{{ live_command }}</pre>
</section></main></body></html>
