# Keep this file small. Add a section for each layer as you build it.
paths:
  db: outputs/events.db
  snapshots: outputs/snapshots
  labels: data/labels.csv

video:
  target_fps: 5              # frames processed per second of video

preprocess:                  # conservative enhancement before model inference
  enabled: true
  denoise_kernel: 3          # Gaussian kernel; 0 disables denoising
  clahe_clip: 1.5            # local contrast; 0 disables CLAHE
  clahe_grid: 8
  sharpen_amount: 0.35       # mild unsharp mask; 0 disables sharpening
  upscale: 1.0               # set to 1.5 only after measuring speed and recall

detector:                    # layer 2: select a PPE model profile
  active_model: ppe
  models:
    yolo11m_ppe:
      weights: weights/yolo11m-best.pt
      conf: 0.25             # minimum detection confidence
      imgsz: 960             # larger helps small helmets on CCTV, costs compute
      person_class: Person
      classes: [Person, Hardhat, Safety-Vest, NO-Hardhat, NO-Safety-Vest]
    ppe:
        weights: weights/ppe.pt
        conf: 0.25             # minimum detection confidence
        imgsz: 960             # larger helps small helmets on CCTV, costs compute
        person_class: person
        classes: [helmet, no-helmet, no-vest, person, vest]
        rules:
          helmet:
            present: [helmet]
            absent: [no-helmet]
            region: [0.0, 0.40]
          vest:
            present: [vest]
            absent: [no-vest]
            region: [0.15, 0.75]

tracking:                    # layer 3
  activation_threshold: 0.4  # detections below this cannot start a new track
  min_consecutive_frames: 2  # frames an object must be seen before it gets an ID

# Zoning layer: per-camera zones. Polygons are fractions of the frame, [x, y] from 0 to 1.
# Draw them with:  python define_zone.py --video data/clips/<clip>.mp4
# A camera that is not listed here uses the whole frame.
cameras:
  gate_cam:
    name: Main gate
    enabled: true
    capabilities: [ppe, vehicles, licence_plates]
    gate_zone: [[0.064, 0.529], [0.173, 0.918], [0.271, 0.915], [0.129, 0.537]]
    detection_zone: [[0.106, 0.512], [0.412, 0.906], [0.995, 0.906], [0.993, 0.493]]
  site_cam:
    name: Main site
    enabled: true
    capabilities: [ppe]
    detection_zone: [[0.0, 0.3], [1.0, 0.3], [1.0, 1.0], [0.0, 1.0]]

# Gate camera: vehicle classification + licence plates, for ONE camera only.
gate:
  camera_id: gate_cam          # only this camera runs the vehicle monitor (must match labels.csv / --camera-id)
  vehicle_weights: weights/yolo26n.pt   # general COCO model (download_weights.py fetches it)
  vehicle_classes: [car, truck, bus, motorcycle]   # class names to keep from that model
  conf: 0.35
  imgsz: 960
  read_plates: true            # false = classify vehicles only
  plate_detector: yolo-v9-t-384-license-plate-end2end
  plate_ocr: cct-xs-v2-global-model
  plate_min_conf: 0.6          # plate reads below this are ignored
  min_vehicle_width_px: 120    # plates are not read on vehicles narrower than this
  finalize_after_s: 3.0        # a vehicle is logged this long after it leaves view
  zone_hold_frames: 2          # a vehicle must be in/out of the gate zone this many frames to count
  store_plate: text            # text | hash | none. Plates are personal information.
  plate_salt: change-me        # mixed into the hash when store_plate is hash

# Layer 4: rules. Class names must match what the model outputs (run.py prints them).
rules:
  confirm_seconds: 3.0       # a violation must last this long before an event
  clear_seconds: 2.0         # no violation for this long ends the episode
  min_person_height_px: 80   # smaller people are "unknown", never a violation
  helmet:                    # remove a section to stop checking that item
    present: [Hardhat]       # classes meaning "worn"
    absent: [NO-Hardhat]     # classes meaning "missing" (leave [] to infer from absence)
    region: [0.0, 0.40]      # band of the person box where the item should be (from the top)
  vest:
    present: [Safety-Vest]
    absent: [NO-Safety-Vest]
    region: [0.15, 0.75]
